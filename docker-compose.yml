services:
  colab-manager:
    build: .
    container_name: colab-manager
    restart: unless-stopped
    ports:
      - "1113:1113"           # Web Console & REST/WebSocket API
      - "2220-2229:2220-2229" # External SSH Multiplexer Port Pool (VS Code / Cursor)
    environment:
      - PORT=1113
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - MASTER_KEY=${MASTER_KEY:-}
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1113/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
