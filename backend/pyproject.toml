[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-management-backend"
version = "0.1.0"
description = "Colab Management Platform Backend Daemon & SSH Multiplexer"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Colab Management Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "cryptography>=43.0.0",
    "asyncssh>=2.17.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "nbformat>=5.10.0",
    "python-multipart>=0.0.12",
    "PyJWT>=2.9.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = [".."]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
